[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rasoi-offer-roulette"
version = "0.1.0"
description = "DOOMFORGE 2026 Marketing Track - Rasoi Express uplift targeting case"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4",
  "pyarrow>=15",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "PyYAML>=6",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "types-PyYAML"]

[project.scripts]
rasoi = "rasoi.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
